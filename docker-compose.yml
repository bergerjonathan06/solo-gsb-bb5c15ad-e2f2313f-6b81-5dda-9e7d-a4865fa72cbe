services:
  sheet-layout:
    build: .
    image: sheet-layout:latest
    container_name: sheet-layout
    ports:
      # 默认映射到宿主机 3000；可用 `PORT=8080 docker compose up -d --build` 改宿主端口
      # 页面：http://localhost:${PORT:-3000}/（裁切试排）
      #       http://localhost:${PORT:-3000}/offcuts.html（余料库存与复用预占）
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    # 余料库存保存在进程内存中（不挂卷、无外部存储）：单实例部署；
    # 重启 / 重建容器会清空已入库余料与预占单
    restart: unless-stopped
